name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            app/src-tauri -> app/src-tauri/target
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            app/pnpm-lock.yaml
            spikes/ui-architecture/pnpm-lock.yaml
            spikes/renderer-store/pnpm-lock.yaml
      - name: Install renderer dependencies
        run: |
          pnpm --dir app install --frozen-lockfile
          pnpm --dir spikes/ui-architecture install --frozen-lockfile
          pnpm --dir spikes/renderer-store install --frozen-lockfile
      - name: Build and verify
        # Bash is required for scripts/build.sh to run correctly on Windows (git bash)
        shell: bash
        # Updater artifacts are only signed in the release workflow; CI builds skip them
        run: ./scripts/build.sh ci ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: skriuw-${{ matrix.platform }}${{ matrix.platform == 'macos-latest' && matrix.args == '--target aarch64-apple-darwin' && '-arm64' || '' }}${{ matrix.platform == 'macos-latest' && matrix.args == '--target x86_64-apple-darwin' && '-x64' || '' }}
          if-no-files-found: error
          path: |
            target/release/skriuw-cli
            target/release/skriuw-cli.exe
            app/src-tauri/target/release/skriuw-app
            app/src-tauri/target/release/skriuw-app.exe
            app/src-tauri/target/release/bundle
            app/dist
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: skriuw-build-logs-${{ matrix.platform }}${{ matrix.platform == 'macos-latest' && matrix.args == '--target aarch64-apple-darwin' && '-arm64' || '' }}${{ matrix.platform == 'macos-latest' && matrix.args == '--target x86_64-apple-darwin' && '-x64' || '' }}
          if-no-files-found: warn
          path: .build/logs
