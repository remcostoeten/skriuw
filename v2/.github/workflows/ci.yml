name: CI

on:
  push:
  pull_request:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            app/src-tauri -> app/src-tauri/target

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            app/pnpm-lock.yaml
            spikes/ui-architecture/pnpm-lock.yaml
            spikes/renderer-store/pnpm-lock.yaml

      - name: Install frontend deps
        run: |
          pnpm --dir app install --frozen-lockfile
          pnpm --dir spikes/ui-architecture install --frozen-lockfile
          pnpm --dir spikes/renderer-store install --frozen-lockfile

      - name: Verify and build
        # Updater artifacts are only signed in the release workflow; CI builds skip them
        run: ./scripts/build.sh ci --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: skriuw-build-logs
          if-no-files-found: warn
          path: .build/logs
