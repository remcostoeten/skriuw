name: CI

on:
  push:
  pull_request:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            app/src-tauri -> app/src-tauri/target

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install frontend deps
        # bun ignores --cwd on the install subcommand, so cd into each dir
        run: |
          (cd app && bun install --frozen-lockfile)
          (cd cloud && bun install --frozen-lockfile)
          (cd spikes/ui-architecture && bun install --frozen-lockfile)
          (cd spikes/renderer-store && bun install --frozen-lockfile)

      - name: Verify and build
        # Updater artifacts are only signed in the release workflow; CI builds skip them
        run: ./scripts/build.sh ci --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Verify browser OPFS durability
        run: ./scripts/check-wasm.sh

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: skriuw-build-logs
          if-no-files-found: warn
          path: .build/logs
