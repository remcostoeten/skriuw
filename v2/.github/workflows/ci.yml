name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            app/pnpm-lock.yaml
            spikes/ui-architecture/pnpm-lock.yaml
            spikes/renderer-store/pnpm-lock.yaml
      - name: Install renderer dependencies
        run: |
          pnpm --dir app install --frozen-lockfile
          pnpm --dir spikes/ui-architecture install --frozen-lockfile
          pnpm --dir spikes/renderer-store install --frozen-lockfile
      - name: Build and verify
        run: ./scripts/build.sh ci
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skriuw-linux
          if-no-files-found: error
          path: |
            target/release/skriuw-cli
            target/release/skriuw-cli.exe
            app/src-tauri/target/release/skriuw-app
            app/src-tauri/target/release/skriuw-app.exe
            app/src-tauri/target/release/bundle
            app/dist
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skriuw-linux-build-logs
          if-no-files-found: warn
          path: .build/logs
