<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skriuw tree virtualization spike</title>
  </head>
  <body>
    <div class="app">
      <div class="pane">
        <h1>Tree virtualization spike</h1>
        <div class="controls">
          <label>
            Fixture
            <select id="fixture-select">
              <option value="nested-1000">nested-1000</option>
              <option value="nested-5000" selected>nested-5000</option>
              <option value="wide-1000">wide-1000</option>
              <option value="wide-5000">wide-5000</option>
              <option value="mixed-1000">mixed-1000</option>
              <option value="mixed-5000">mixed-5000</option>
            </select>
          </label>
          <button id="load-button" type="button">Load fixture</button>
          <button id="run-button" type="button">Run benchmark</button>
        </div>
        <p class="status" id="status">Idle.</p>
        <div id="tree-host"></div>
      </div>
      <div class="pane">
        <h2>States</h2>
        <div class="gallery" id="gallery"></div>
        <div class="results" id="results"></div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
