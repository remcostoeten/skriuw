[package]
name = "skriuw-app"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace]

[lib]
name = "skriuw_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skriuw-domain = { path = "../../crates/skriuw-domain" }
skriuw-history = { path = "../../crates/skriuw-history" }
skriuw-history-git = { path = "../../crates/skriuw-history-git" }
skriuw-images = { path = "../../crates/skriuw-images" }
skriuw-lifecycle = { path = "../../crates/skriuw-lifecycle" }
skriuw-runtime = { path = "../../crates/skriuw-runtime" }
skriuw-sqlite = { path = "../../crates/skriuw-sqlite" }
skriuw-storage = { path = "../../crates/skriuw-storage" }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.4.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-prevent-default = "5.0.2"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"

[target."cfg(target_os = \"linux\")".dependencies]
# Same 0.18 line the gtk stack in the lockfile resolves to; used only for
# set_prgname in main.rs (Wayland taskbar-icon fix).
glib = "0.18"

[dev-dependencies]
tempfile = "3"
