[package]
name = "skriuw-app"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace]

[lib]
name = "skriuw_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skriuw-domain = { path = "../../crates/skriuw-domain" }
skriuw-history = { path = "../../crates/skriuw-history" }
skriuw-history-git = { path = "../../crates/skriuw-history-git" }
skriuw-runtime = { path = "../../crates/skriuw-runtime" }
skriuw-sqlite = { path = "../../crates/skriuw-sqlite" }
tauri = { version = "2.11.5", features = [] }

[dev-dependencies]
skriuw-storage = { path = "../../crates/skriuw-storage" }
tempfile = "3"
