[package]
name = "skriuw-sqlite-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Browser worker boundary for the OPFS-backed SQLite-WASM adapter"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rusqlite.workspace = true
skriuw-domain = { path = "../skriuw-domain" }
skriuw-storage = { path = "../skriuw-storage" }
skriuw-sync = { path = "../skriuw-sync" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
skriuw-sqlite = { path = "../skriuw-sqlite" }
sqlite-wasm-rs = "0.5.5"
sqlite-wasm-vfs = "0.2.0"
uuid = { workspace = true, features = ["js"] }
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"

[dev-dependencies]
skriuw-fixtures = { path = "../skriuw-fixtures" }
skriuw-sqlite = { path = "../skriuw-sqlite" }
