<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="theme-color" content="#121212" />
		<title>Offline — Skriuw</title>
		<style>
			:root {
				color-scheme: dark;
				--bg: #121212;
				--fg: #ececec;
				--muted: #9a9a9a;
				--border: #2c2c2c;
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				height: 100%;
			}
			body {
				font-family:
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					"Segoe UI",
					sans-serif;
				background: var(--bg);
				color: var(--fg);
				display: flex;
				align-items: center;
				justify-content: center;
				min-height: 100dvh;
				margin: 0;
				padding: calc(env(safe-area-inset-top) + 1.5rem)
					calc(env(safe-area-inset-right) + 1.5rem)
					calc(env(safe-area-inset-bottom) + 1.5rem)
					calc(env(safe-area-inset-left) + 1.5rem);
				-webkit-font-smoothing: antialiased;
			}
			.card {
				text-align: center;
				width: 100%;
				max-width: 20rem;
			}
			img {
				width: 64px;
				height: 64px;
				border-radius: 14px;
			}
			h1 {
				font-size: 1.25rem;
				line-height: 1.3;
				margin: 1.25rem 0 0.4rem;
			}
			p {
				color: var(--muted);
				font-size: 0.95rem;
				line-height: 1.5;
				margin: 0 0 1.75rem;
			}
			button {
				min-height: 44px;
				min-width: 44px;
				background: transparent;
				color: var(--fg);
				border: 1px solid var(--border);
				padding: 0.65rem 1.5rem;
				border-radius: 10px;
				font-size: 0.95rem;
				font-weight: 500;
				cursor: pointer;
				transition: background-color 0.15s ease;
			}
			button:active {
				background: rgba(255, 255, 255, 0.06);
			}
		</style>
	</head>
	<body>
		<div class="card">
			<img src="/icon-192.png" alt="Skriuw" />
			<h1>You&rsquo;re offline</h1>
			<p>
				Skriuw needs a connection to load this page. Your notes sync again once you&rsquo;re
				back online.
			</p>
			<button type="button" onclick="location.reload()">Retry</button>
		</div>
		<script>
			window.addEventListener("online", function () {
				location.reload();
			});
		</script>
	</body>
</html>
