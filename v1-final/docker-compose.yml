services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: skriuw
      POSTGRES_PASSWORD: skriuw
      POSTGRES_DB: skriuw
    volumes:
      - skriuw-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skriuw"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Pull the published image. To build from source instead, use:
    #   docker compose -f docker-compose.build.yml up --build
    image: ghcr.io/remcostoeten/skriuw:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # `.env` is optional: the entrypoint fails fast with a clear message if a
    # required secret is missing, so you don't get a cryptic runtime error.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://skriuw:skriuw@db:5432/skriuw?sslmode=disable
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  skriuw-db:
