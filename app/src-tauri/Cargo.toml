[package]
name = "skriuw-app"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace]

[lib]
name = "skriuw_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skriuw-ai = { path = "../../crates/skriuw-ai" }
skriuw-ai-ollama = { path = "../../crates/skriuw-ai-ollama" }
skriuw-ai-remote = { path = "../../crates/skriuw-ai-remote" }
skriuw-domain = { path = "../../crates/skriuw-domain" }
skriuw-history = { path = "../../crates/skriuw-history" }
skriuw-history-git = { path = "../../crates/skriuw-history-git" }
skriuw-images = { path = "../../crates/skriuw-images" }
skriuw-lifecycle = { path = "../../crates/skriuw-lifecycle" }
skriuw-runtime = { path = "../../crates/skriuw-runtime" }
skriuw-sqlite = { path = "../../crates/skriuw-sqlite" }
skriuw-storage = { path = "../../crates/skriuw-storage" }
skriuw-sync = { path = "../../crates/skriuw-sync" }
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
tauri-plugin-dialog = "2.4.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-prevent-default = "5.0.2"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
tauri-plugin-window-state = "2.4.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate", "deflate64"] }
uuid = { version = "1", features = ["v4"] }

[target."cfg(target_os = \"linux\")".dependencies]
# Same 0.18 line the gtk stack in the lockfile resolves to; used only for
# set_prgname in main.rs (Wayland taskbar-icon fix).
glib = "0.18"
keyring = { version = "3.6.3", features = ["linux-native-sync-persistent", "crypto-rust"] }
# Secret Service is queried directly so a locked or absent keyring is a visible,
# actionable settings state rather than a failed save inside the keyring crate.
dbus-secret-service = { version = "4.1", features = ["crypto-rust"] }

[target."cfg(target_os = \"macos\")".dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target."cfg(target_os = \"windows\")".dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
