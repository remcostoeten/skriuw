[package]
name = "skriuw-desktop"
version = "0.13.2"
description = "Skriuw desktop shell (local-first)"
authors = ["Remco Stoeten"]
edition = "2021"

[lib]
name = "skriuw_desktop_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2.3.1", features = [] }

[dependencies]
tauri = { version = "2.8.0", features = ["tray-icon"] }
# `tauri-runtime`/`tauri-runtime-wry` publish ahead of the `tauri` crate; caret
# resolution otherwise floats them to a runtime newer than `tauri` 2.8 can build
# against. Pin to the 2.10 line (same constraint dora uses).
tauri-runtime = "~2.10"
tauri-runtime-wry = "~2.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# Bundled SQLite so the desktop build needs no system libsqlite3.
rusqlite = { version = "0.32", features = ["bundled"] }
# Native foundation: filesystem + native dialogs (import/export, vault picker)
# and window size/position persistence across launches.
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
# Guards the shared SQLite index/vault: a second launch focuses the running
# window instead of opening a competing copy.
tauri-plugin-single-instance = "2"
# Markdown → HTML rendering for the "Export note → HTML" command.
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
# Vault backup / export-import as a portable .zip of the markdown vault.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Local + cloud AI: HTTP to Ollama / Groq / Gemini, streamed model downloads,
# and managed-Ollama archive extraction (tar.zst on Linux, tgz on macOS, zip on
# Windows). rustls avoids a system OpenSSL dependency in the bundle.
reqwest = { version = "0.12", default-features = false, features = [
	"json",
	"stream",
	"rustls-tls",
] }
futures-util = "0.3"
tar = "0.4"
zstd = "0.13"
flate2 = "1"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
# Thin LTO keeps most of fat LTO's size/perf wins but is far faster and
# parallelizable; combined with codegen-units > 1 it lets the build use all
# cores and lets the mold linker actually help. Trades a few % binary size for
# a much shorter compile.
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"
