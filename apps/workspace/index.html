<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, follow" />
    <meta
      name="description"
      content="Use Skriuw in your browser: a fast, private, local-first workspace for notes, journals, Markdown, and connected knowledge."
    />
    <link rel="canonical" href="https://skriuw.com/app/" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Skriuw" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Replaced with the active palette background by shell/theme-color.ts. -->
    <meta name="theme-color" content="#121212" />
    <title>Skriuw Web App</title>
    <script nonce="__TAURI_SCRIPT_NONCE__">
      // Runs before the bundle so the first paint already carries the user's
      // palette. The persisted settings document is only readable after
      // bootstrapWorkspace resolves, which is too late to avoid a flash.
      // Mirrored by src/settings/boot-appearance.ts; keep the key in step.
      (function () {
        var root = document.documentElement;
        var theme = "midnight";
        var colorScheme = "dark";
        var tokens = null;
        try {
          var stored = window.localStorage.getItem("skriuw.boot-appearance");
          var parsed = stored ? JSON.parse(stored) : null;
          if (parsed && /^[a-z0-9][a-z0-9-]{0,63}$/.test(parsed.theme)) {
            theme = parsed.theme;
          }
          if (parsed && (parsed.colorScheme === "light" || parsed.colorScheme === "dark")) {
            colorScheme = parsed.colorScheme;
          }
          tokens = parsed && parsed.tokens && typeof parsed.tokens === "object" ? parsed.tokens : null;
        } catch (error) {
          theme = "midnight";
          colorScheme = "dark";
          tokens = null;
        }
        if (tokens) {
          Object.keys(tokens).forEach(function (token) {
            var color = tokens[token];
            var match = typeof color === "string" && /^hsl\((-?[\d.]+),\s*([\d.]+%),\s*([\d.]+%)\)$/.exec(color);
            if (/^[a-z0-9-]+$/.test(token) && match) {
              root.style.setProperty("--" + token, match[1] + " " + match[2] + " " + match[3]);
            }
          });
        }
        root.dataset.theme = theme;
        root.dataset.colorScheme = colorScheme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="auth-drawer-portal"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
