<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, follow" />
    <meta
      name="description"
      content="Use Skriuw in your browser: a fast, private, local-first workspace for notes, journals, Markdown, and connected knowledge."
    />
    <link rel="canonical" href="https://skriuw.com/app/" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Skriuw" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Replaced with the active palette background by shell/theme-color.ts. -->
    <meta name="theme-color" content="#121212" />
    <title>Skriuw Web App</title>
    <script nonce="__TAURI_SCRIPT_NONCE__">
      // Runs before the bundle so the first paint already carries the user's
      // palette. The persisted settings document is only readable after
      // bootstrapWorkspace resolves, which is too late to avoid a flash.
      // Mirrored by src/settings/boot-appearance.ts; keep the key in step.
      (function () {
        var root = document.documentElement;
        var theme = "midnight";
        var colorScheme = "dark";
        var tokens = null;
        try {
          var stored = window.localStorage.getItem("skriuw.boot-appearance");
          var parsed = stored ? JSON.parse(stored) : null;
          if (parsed && /^[a-z0-9][a-z0-9-]{0,63}$/.test(parsed.theme)) {
            theme = parsed.theme;
          }
          if (parsed && (parsed.colorScheme === "light" || parsed.colorScheme === "dark")) {
            colorScheme = parsed.colorScheme;
          }
          tokens = parsed && parsed.tokens && typeof parsed.tokens === "object" ? parsed.tokens : null;
        } catch (error) {
          theme = "midnight";
          colorScheme = "dark";
          tokens = null;
        }
        if (tokens) {
          Object.keys(tokens).forEach(function (token) {
            var color = tokens[token];
            var match = typeof color === "string" && /^hsl\((-?[\d.]+),\s*([\d.]+%),\s*([\d.]+%)\)$/.exec(color);
            if (/^[a-z0-9-]+$/.test(token) && match) {
              root.style.setProperty("--" + token, match[1] + " " + match[2] + " " + match[3]);
            }
          });
        }
        root.dataset.theme = theme;
        root.dataset.colorScheme = colorScheme;
      })();
    </script>
    <script nonce="__TAURI_SCRIPT_NONCE__">
      // Starts the workspace reads while the bundle downloads and evaluates.
      // Consumed once by src/app/early-bootstrap.ts; keep the shape in step.
      (function () {
        var internals = window.__TAURI_INTERNALS__;
        if (!internals) {
          return;
        }
        function start(command) {
          var pending = internals.invoke(command);
          pending.catch(function (error) {
            console.error("early " + command + " failed", error);
          });
          return pending;
        }
        window.__SKRIUW_EARLY_BOOTSTRAP__ = {
          snapshot: start("bootstrap_workspace_at_epoch"),
          sidebarExpansion: start("load_sidebar_expansion"),
          paneLayout: start("load_pane_layout"),
        };
      })();
    </script>
    <style>
      .boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: hsl(var(--background, 2 0% 7%));
        color: hsl(var(--foreground, 0 0% 91%));
        cursor: default;
        overflow: hidden;
      }
      .boot-splash::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 360px;
        height: 360px;
        margin: -180px 0 0 -180px;
        border-radius: 50%;
        background: radial-gradient(
          closest-side,
          hsl(var(--foreground, 0 0% 91%) / 0.07),
          transparent
        );
        animation: boot-splash-glow 900ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .boot-splash svg {
        position: relative;
        width: 96px;
        height: 96px;
        overflow: visible;
        -webkit-mask-image: linear-gradient(
          105deg,
          rgb(0 0 0 / 0.58) 36%,
          #000 50%,
          rgb(0 0 0 / 0.58) 64%
        );
        mask-image: linear-gradient(
          105deg,
          rgb(0 0 0 / 0.58) 36%,
          #000 50%,
          rgb(0 0 0 / 0.58) 64%
        );
        -webkit-mask-size: 300% 100%;
        mask-size: 300% 100%;
        -webkit-mask-position: 100% 0;
        mask-position: 100% 0;
        animation: boot-splash-sheen 2.6s cubic-bezier(0.45, 0, 0.55, 1) 700ms infinite;
      }
      .boot-splash rect {
        transform-box: fill-box;
        transform-origin: center;
        animation:
          boot-splash-rise 560ms cubic-bezier(0.22, 1, 0.36, 1) both,
          boot-splash-ripple 2.6s ease-in-out 700ms infinite;
      }
      .boot-splash rect:nth-child(2) {
        animation-delay: 80ms, 815ms;
      }
      .boot-splash rect:nth-child(3) {
        animation-delay: 160ms, 930ms;
      }
      @keyframes boot-splash-glow {
        from {
          opacity: 0;
          transform: scale(0.85);
        }
      }
      @keyframes boot-splash-rise {
        from {
          opacity: 0;
          transform: scaleY(0.4);
        }
      }
      @keyframes boot-splash-sheen {
        45%,
        100% {
          -webkit-mask-position: 0 0;
          mask-position: 0 0;
        }
      }
      @keyframes boot-splash-ripple {
        18% {
          transform: scaleY(1.07);
        }
        0%,
        38%,
        100% {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" role="status" aria-busy="true" aria-label="Skriuw is starting">
        <svg viewBox="0 0 40 40" fill="currentColor" aria-hidden="true">
          <rect x="4" y="8" width="8" height="24" rx="1" />
          <rect x="16" y="4" width="8" height="32" rx="1" />
          <rect x="28" y="12" width="8" height="16" rx="1" />
        </svg>
      </div>
    </div>
    <script nonce="__TAURI_SCRIPT_NONCE__">
      // WebKitGTK may not schedule frames for an unmapped window, so the frame path races a timer.
      (function () {
        var internals = window.__TAURI_INTERNALS__;
        if (!internals) {
          return;
        }
        var revealed = false;
        function reveal() {
          if (revealed) {
            return;
          }
          revealed = true;
          internals.invoke("reveal_main_window_command").catch(function (error) {
            console.error("window reveal failed", error);
          });
        }
        requestAnimationFrame(function () {
          requestAnimationFrame(reveal);
        });
        setTimeout(reveal, 50);
      })();
    </script>
    <div id="auth-drawer-portal"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
