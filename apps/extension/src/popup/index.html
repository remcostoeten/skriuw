<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Save to Skriuw</title>
		<style>
			:root {
				color-scheme: light dark;
				--bg: #f7f6f2;
				--panel: #ffffff;
				--text: #1d1c19;
				--muted: #6f6b62;
				--border: #ded8cc;
				--accent: #302c27;
				--accent-strong: #1d1c19;
				--accent-foreground: #f7f6f2;
				--ok: #137a43;
				--error: #b42318;
				--shadow: 0 18px 45px rgba(29, 28, 25, 0.11);
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #151412;
					--panel: #201f1c;
					--text: #f4f0e8;
					--muted: #aaa39a;
					--border: #39352f;
					--accent: #d8cfc0;
					--accent-strong: #f4f0e8;
					--accent-foreground: #151412;
					--ok: #6ee7a5;
					--error: #ff8a7a;
					--shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
				}
			}
			body {
				margin: 0;
				width: 360px;
				font:
					13px/1.45 Inter,
					ui-sans-serif,
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					"Segoe UI",
					sans-serif;
				background: var(--bg);
				color: var(--text);
			}
			.shell {
				padding: 14px;
			}
			.header {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 12px;
				margin-bottom: 12px;
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 10px;
				min-width: 0;
			}
			.logo {
				width: 34px;
				height: 34px;
				border-radius: 8px;
				box-shadow: 0 1px 0 color-mix(in srgb, white 45%, transparent) inset;
			}
			.eyebrow {
				margin: 0 0 2px;
				color: var(--muted);
				font-size: 10px;
				font-weight: 700;
				letter-spacing: 0.14em;
				text-transform: uppercase;
			}
			h1 {
				margin: 0;
				font-size: 18px;
				line-height: 1.1;
			}
			.panel {
				border: 1px solid var(--border);
				border-radius: 10px;
				background: color-mix(in srgb, var(--panel) 94%, transparent);
				box-shadow: var(--shadow);
				padding: 12px;
			}
			.empty {
				color: var(--muted);
				text-align: center;
			}
			.empty p {
				margin: 0 0 10px;
			}
			label {
				display: block;
				font-weight: 700;
				font-size: 12px;
				margin: 10px 0 4px;
			}
			label:first-child {
				margin-top: 0;
			}
			input,
			select {
				width: 100%;
				box-sizing: border-box;
				padding: 8px 9px;
				border: 1px solid var(--border);
				border-radius: 8px;
				background: color-mix(in srgb, var(--panel) 80%, var(--bg));
				color: var(--text);
				outline: none;
			}
			input:focus,
			select:focus {
				border-color: var(--accent);
				box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
			}
			.check-row {
				display: flex;
				align-items: center;
				gap: 8px;
				color: var(--muted);
				font-weight: 700;
			}
			.check-row input {
				width: 14px;
				height: 14px;
				padding: 0;
				margin: 0;
				accent-color: var(--accent);
			}
			.url {
				opacity: 0.65;
				font-size: 11px;
				word-break: break-all;
				margin-top: 2px;
			}
			.preview {
				max-height: 96px;
				overflow: auto;
				white-space: pre-wrap;
				border: 1px solid var(--border);
				border-radius: 8px;
				padding: 8px;
				background: color-mix(in srgb, var(--text) 4%, transparent);
				color: var(--muted);
			}
			button {
				width: 100%;
				padding: 9px 10px;
				border: 0;
				border-radius: 8px;
				background: var(--accent);
				color: var(--accent-foreground);
				font-weight: 700;
				cursor: pointer;
			}
			.panel > button {
				margin-top: 12px;
			}
			button:hover {
				background: var(--accent-strong);
			}
			button:disabled {
				opacity: 0.5;
				cursor: default;
			}
			.icon-button {
				width: auto;
				margin: 0;
				padding: 6px 9px;
				border: 1px solid var(--border);
				background: color-mix(in srgb, var(--panel) 76%, transparent);
				color: var(--text);
				font-size: 12px;
			}
			.icon-button:hover {
				background: color-mix(in srgb, var(--text) 8%, transparent);
			}
			.secondary-button {
				border: 1px solid var(--border);
				background: color-mix(in srgb, var(--text) 6%, transparent);
				color: var(--text);
			}
			.secondary-button:hover {
				background: color-mix(in srgb, var(--text) 10%, transparent);
			}
			.status {
				margin-top: 10px;
				border-radius: 8px;
				padding: 8px;
				font-weight: 700;
			}
			.error {
				background: color-mix(in srgb, var(--error) 11%, transparent);
				color: var(--error);
			}
			.ok {
				background: color-mix(in srgb, var(--ok) 12%, transparent);
				color: var(--ok);
			}
			.endpoint {
				margin: 10px 2px 0;
				color: var(--muted);
				font-size: 11px;
				word-break: break-all;
			}
			.activity {
				margin-top: 10px;
				border: 1px solid var(--border);
				border-radius: 10px;
				background: color-mix(in srgb, var(--panel) 70%, transparent);
				padding: 10px;
			}
			.activity-title {
				margin-bottom: 6px;
				color: var(--muted);
				font-size: 10px;
				font-weight: 700;
				letter-spacing: 0.14em;
				text-transform: uppercase;
			}
			.activity-item {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 10px;
				padding: 5px 0;
				border-top: 1px solid color-mix(in srgb, var(--border) 55%, transparent);
				font-size: 12px;
			}
			.activity-item:first-of-type {
				border-top: 0;
			}
			.activity-item span {
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.activity-item time {
				flex: 0 0 auto;
				color: var(--muted);
				font-size: 11px;
			}
			.footer {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 8px;
				margin-top: 12px;
				border-top: 1px solid var(--border);
				padding-top: 10px;
				color: var(--muted);
				font-size: 12px;
			}
			a {
				color: var(--accent);
				font-weight: 700;
				text-decoration: none;
			}
			.version {
				font-variant-numeric: tabular-nums;
			}
			a:hover {
				text-decoration: underline;
			}
		</style>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="./main.tsx"></script>
	</body>
</html>
