  every dependency edge) is embedded below in
  <script type="application/json" id="architecture-data">. Read that block —

				height: 100%;
				overflow: hidden;

				color: var(--text);

					system-ui,
					-apple-system,
					"Segoe UI",
					sans-serif;
			}
			#canvas {
				display: block;
				width: 100%;
				height: 100%;
				cursor: grab;
			}
			#canvas.dragging {
				cursor: grabbing;
			}

				position: fixed;
				top: 0;
				left: 0;
				right: 0;

				align-items: center;
				gap: 16px;
				flex-wrap: wrap;
				padding: 10px 16px;

				backdrop-filter: blur(8px);
				border-bottom: 1px solid var(--panel-border);
				font-size: 13px;
			}
			#topbar h1 {
				font-size: 14px;
				margin: 0;
				font-weight: 600;
				white-space: nowrap;
			}
			#topbar h1 span {
				color: var(--text-dim);
				font-weight: 400;
			}
			.legend {
				display: flex;
				gap: 12px;
				flex-wrap: wrap;
				align-items: center;
			}
			.legend-item {
				display: flex;
				align-items: center;
				gap: 5px;
				color: var(--text-dim);
			}
			.swatch {
				width: 11px;
				height: 11px;
				border-radius: 3px;
				display: inline-block;
			}
			label.toggle {
				display: flex;
				align-items: center;
				gap: 6px;
				cursor: pointer;
				user-select: none;
				color: var(--text);
				background: var(--panel);
				border: 1px solid var(--panel-border);
				border-radius: 6px;
				padding: 4px 10px;
			}
			button.reset {
				background: var(--panel);
				color: var(--text);
				border: 1px solid var(--panel-border);
				border-radius: 6px;
				padding: 4px 10px;
				cursor: pointer;
				font-size: 13px;
			}
			button.reset:hover {
				border-color: var(--accent);
			}

			#sidebar {
				position: fixed;
				top: 52px;
				right: 0;
				bottom: 0;
				width: 380px;
				max-width: 92vw;
				z-index: 9;
				background: var(--panel);
				border-left: 1px solid var(--panel-border);
				padding: 18px 20px 40px;
				overflow-y: auto;
				transform: translateX(100%);
				transition: transform 0.18s ease;
				font-size: 13.5px;
				line-height: 1.55;

			#sidebar.open {
				transform: translateX(0);
			}
			#sidebar .close {
				position: absolute;
				top: 10px;
				right: 12px;
				background: none;
				border: none;
				color: var(--text-dim);
				font-size: 20px;
				cursor: pointer;
			}
			#sidebar h2 {
				margin: 0 44px 4px 0;
				font-size: 17px;
			}
			#sidebar .badges {
				display: flex;
				gap: 6px;
				flex-wrap: wrap;
				margin: 8px 0 14px;
			}

				font-size: 11px;
				padding: 2px 8px;
				border-radius: 999px;
				border: 1px solid;
				font-weight: 600;
				letter-spacing: 0.03em;

			#sidebar h3 {
				font-size: 11px;
				text-transform: uppercase;
				letter-spacing: 0.08em;
				color: var(--text-dim);
				margin: 16px 0 6px;

			#sidebar p {
				margin: 6px 0;
				color: var(--text);
			}
			#sidebar ul {
				margin: 4px 0;
				padding-left: 18px;
				color: var(--text);
			}
			#sidebar code {
				background: #0d1117;
				border: 1px solid var(--panel-border);

				padding: 1px 5px;
				font-size: 12px;

				margin-bottom: 3px;

				color: var(--text-dim);
				font-size: 12px;

				position: fixed;
				bottom: 14px;
				left: 16px;
				z-index: 8;
				color: var(--text-dim);
				font-size: 12px;
				background: color-mix(in srgb, var(--panel) 80%, transparent);
				padding: 6px 10px;
				border-radius: 6px;
				border: 1px solid var(--panel-border);

					{ "from": "extension", "to": "sync-api", "label": "bearer POST" },
					{ "from": "desktop", "to": "wb-types", "label": "tauri-backend implements" },
					{ "from": "webspa", "to": "extraction", "label": "replaced by" },
					{
						"from": "offline-sync",
						"to": "workspace-api",
						"label": "V3: preconditions grow into sync"
					}
				]
			}
		</script>

		<script>
			(function () {
				const DATA = JSON.parse(document.getElementById("architecture-data").textContent);
				const canvas = document.getElementById("canvas");
				const ctx = canvas.getContext("2d");
				const sidebar = document.getElementById("sidebar");
				const sidebarContent = document.getElementById("sidebarContent");
				const mvpToggle = document.getElementById("mvpToggle");

				const CLASS_COLORS = {
					REUSE: "#3fb950",
					ADAPT: "#58a6ff",
					REWRITE: "#d29922",
					SERVER: "#bc8cff",
					NEW: "#f778ba",
					STORE: "#39c5cf",
					SKIP: "#6e7681",
				};

				const nodeById = {};
				DATA.nodes.forEach(function (n) {
					nodeById[n.id] = n;
				});

				let view = { x: 0, y: 0, scale: 1 };
				let selected = null;
				let hovered = null;
				let mvpOnly = false;

				function fitView() {
					const pad = 60;
					const worldW = 2700,
						worldH = 1400;
					const availW = window.innerWidth - pad * 2;
					const availH = window.innerHeight - 52 - pad * 2;
					const scale = Math.min(availW / worldW, availH / worldH, 1);
					view.scale = Math.max(scale, 0.25);
					view.x = (window.innerWidth - worldW * view.scale) / 2;
					view.y = 52 + (window.innerHeight - 52 - worldH * view.scale) / 2;
				}

				function resize() {
					const dpr = window.devicePixelRatio || 1;
					canvas.width = window.innerWidth * dpr;
					canvas.height = window.innerHeight * dpr;
					canvas.style.width = window.innerWidth + "px";
					canvas.style.height = window.innerHeight + "px";
					ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
					draw();
				}

				function nodeVisible(n) {
					if (!mvpOnly) return true;
					return n.mvp === true || n.mvp === "partial";
				}

				function nodeAlpha(n) {
					if (!mvpOnly) return 1;
					if (n.mvp === true) return 1;
					if (n.mvp === "partial") return 0.75;
					return 0.13;
				}

				function anchor(from, to) {
					const fx = from.x + from.w / 2,
						fy = from.y + from.h / 2;
					const tx = to.x + to.w / 2,
						ty = to.y + to.h / 2;
					function edgePoint(n, ox, oy) {
						const cx = n.x + n.w / 2,
							cy = n.y + n.h / 2;
						const dx = ox - cx,
							dy = oy - cy;
						if (dx === 0 && dy === 0) return { x: cx, y: cy };
						const sx = n.w / 2 / Math.abs(dx || 1e-9);
						const sy = n.h / 2 / Math.abs(dy || 1e-9);
						const s = Math.min(sx, sy);
						return { x: cx + dx * s, y: cy + dy * s };
					}
					return { a: edgePoint(from, tx, ty), b: edgePoint(to, fx, fy) };
				}

				function roundRect(x, y, w, h, r) {
					ctx.beginPath();
					ctx.moveTo(x + r, y);
					ctx.arcTo(x + w, y, x + w, y + h, r);
					ctx.arcTo(x + w, y + h, x, y + h, r);
					ctx.arcTo(x, y + h, x, y, r);
					ctx.arcTo(x, y, x + w, y, r);
					ctx.closePath();
				}

				function wrapText(text, maxWidth, font) {
					ctx.font = font;
					const words = text.split(" ");
					const lines = [];
					let line = "";
					words.forEach(function (w) {
						const test = line ? line + " " + w : w;
						if (ctx.measureText(test).width > maxWidth && line) {
							lines.push(line);
							line = w;
						} else line = test;
					});
					if (line) lines.push(line);
					return lines;
				}

				function draw() {
					ctx.save();
					ctx.setTransform(
						window.devicePixelRatio || 1,
						0,
						0,
						window.devicePixelRatio || 1,
						0,
						0,
					);
					ctx.fillStyle = "#0d1117";
					ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
					ctx.translate(view.x, view.y);
					ctx.scale(view.scale, view.scale);

					DATA.groups.forEach(function (g) {
						ctx.globalAlpha = 1;
						ctx.strokeStyle = g.color + "44";
						ctx.fillStyle = g.color + "0a";
						ctx.lineWidth = 1.5;
						roundRect(g.x, g.y, g.w, g.h, 14);
						ctx.fill();
						ctx.stroke();
						ctx.fillStyle = g.color + "cc";
						ctx.font = "600 15px ui-sans-serif, system-ui";
						ctx.fillText(g.label, g.x + 16, g.y + 28);
					});

					DATA.edges.forEach(function (e) {
						const from = nodeById[e.from],
							to = nodeById[e.to];
						if (!from || !to) return;
						const alpha = Math.min(nodeAlpha(from), nodeAlpha(to));
						const isSel =
							selected && (selected.id === from.id || selected.id === to.id);
						ctx.globalAlpha = alpha * (isSel ? 1 : 0.55);
						const pts = anchor(from, to);
						const midX = (pts.a.x + pts.b.x) / 2,
							midY = (pts.a.y + pts.b.y) / 2;
						ctx.strokeStyle = isSel ? "#58a6ff" : "#8b949e";
						ctx.lineWidth = isSel ? 2.5 : 1.2;
						ctx.beginPath();
						ctx.moveTo(pts.a.x, pts.a.y);
						const dx = pts.b.x - pts.a.x;
						ctx.bezierCurveTo(
							pts.a.x + dx * 0.4,
							pts.a.y,
							pts.b.x - dx * 0.4,
							pts.b.y,
							pts.b.x,
							pts.b.y,
						);
						ctx.stroke();
						const angle = Math.atan2(pts.b.y - midY, pts.b.x - (pts.b.x - dx * 0.4));
						ctx.beginPath();
						ctx.moveTo(pts.b.x, pts.b.y);
						ctx.lineTo(
							pts.b.x - 9 * Math.cos(angle - 0.4),
							pts.b.y - 9 * Math.sin(angle - 0.4),
						);
						ctx.lineTo(
							pts.b.x - 9 * Math.cos(angle + 0.4),
							pts.b.y - 9 * Math.sin(angle + 0.4),
						);
						ctx.closePath();
						ctx.fillStyle = isSel ? "#58a6ff" : "#8b949e";
						ctx.fill();
						if (e.label && (isSel || view.scale > 0.55)) {
							ctx.font = "11px ui-sans-serif, system-ui";
							ctx.fillStyle = isSel ? "#58a6ff" : "#8b949e";
							const tw = ctx.measureText(e.label).width;
							ctx.globalAlpha = alpha * (isSel ? 1 : 0.8);
							ctx.fillStyle = "#0d1117";
							ctx.fillRect(midX - tw / 2 - 3, midY - 8, tw + 6, 14);
							ctx.fillStyle = isSel ? "#79b8ff" : "#8b949e";
							ctx.fillText(e.label, midX - tw / 2, midY + 3);
						}
					});

					DATA.nodes.forEach(function (n) {
						const color = CLASS_COLORS[n.class] || "#8b949e";
						const isSel = selected && selected.id === n.id;
						const isHov = hovered && hovered.id === n.id;
						ctx.globalAlpha = nodeAlpha(n);
						roundRect(n.x, n.y, n.w, n.h, 10);
						ctx.fillStyle = isSel ? color + "33" : "#161b22";
						ctx.fill();
						ctx.strokeStyle = isSel ? color : isHov ? color + "dd" : color + "88";
						ctx.lineWidth = isSel ? 3 : isHov ? 2.2 : 1.6;
						ctx.stroke();

						ctx.fillStyle = color;
						ctx.fillRect(n.x, n.y, 5, n.h);

						if (n.mvp === true || n.mvp === "partial") {
							ctx.font = "700 10px ui-sans-serif, system-ui";
							const tag = n.mvp === true ? "MVP" : "MVP◐";
							const tw = ctx.measureText(tag).width;
							ctx.fillStyle = "#3fb95022";
							ctx.strokeStyle = "#3fb950";
							ctx.lineWidth = 1;
							roundRect(n.x + n.w - tw - 18, n.y + 7, tw + 10, 15, 7);
							ctx.fill();
							ctx.stroke();
							ctx.fillStyle = "#3fb950";
							ctx.fillText(tag, n.x + n.w - tw - 13, n.y + 18);
						}

						const pad = 14;
						ctx.fillStyle = "#e6edf3";
						const titleLines = wrapText(
							n.label,
							n.w - pad * 2 - (n.mvp ? 42 : 0),
							"600 13.5px ui-sans-serif, system-ui",
						);
						let ty = n.y + 24;
						titleLines.slice(0, 2).forEach(function (l) {
							ctx.font = "600 13.5px ui-sans-serif, system-ui";
							ctx.fillText(l, n.x + pad, ty);
							ty += 17;
						});
						ctx.fillStyle = "#8b949e";
						const subLines = wrapText(
							n.sub || "",
							n.w - pad * 2,
							"12px ui-sans-serif, system-ui",
						);
						subLines.slice(0, 2).forEach(function (l) {
							ctx.font = "12px ui-sans-serif, system-ui";
							ctx.fillText(l, n.x + pad, ty);
							ty += 15;
						});
					});

					ctx.restore();
				}

				function screenToWorld(sx, sy) {
					return { x: (sx - view.x) / view.scale, y: (sy - view.y) / view.scale };
				}

				function nodeAt(sx, sy) {
					const p = screenToWorld(sx, sy);
					for (let i = DATA.nodes.length - 1; i >= 0; i--) {
						const n = DATA.nodes[i];
						if (p.x >= n.x && p.x <= n.x + n.w && p.y >= n.y && p.y <= n.y + n.h)
							return n;
					}
					return null;
				}

				function esc(s) {
					return String(s)
						.replace(/&/g, "&amp;")
						.replace(/</g, "&lt;")
						.replace(/>/g, "&gt;");
				}

				function openSidebar(n) {
					const color = CLASS_COLORS[n.class];
					const classDesc = DATA.meta.classes[n.class] || "";
					const mvpBadge =
						n.mvp === true
							? '<span class="badge" style="color:#3fb950;border-color:#3fb950">IN MVP</span>'
							: n.mvp === "partial"
								? '<span class="badge" style="color:#3fb950;border-color:#3fb95088">PARTIALLY IN MVP</span>'
								: '<span class="badge" style="color:#8b949e;border-color:#8b949e66">POST-MVP / N-A</span>';
					const deps = DATA.edges
						.filter(function (e) {
							return e.from === n.id;
						})
						.map(function (e) {
							return (
								"→ " +
								esc(nodeById[e.to].label) +
								(e.label ? " <span class='meta'>(" + esc(e.label) + ")</span>" : "")
							);
						});
					const dependents = DATA.edges
						.filter(function (e) {
							return e.to === n.id;
						})
						.map(function (e) {
							return (
								"← " +
								esc(nodeById[e.from].label) +
								(e.label ? " <span class='meta'>(" + esc(e.label) + ")</span>" : "")
							);
						});

					sidebarContent.innerHTML =
						"<h2>" +
						esc(n.label) +
						"</h2>" +
						"<div class='meta'>" +
						esc(n.sub || "") +
						"</div>" +
						"<div class='badges'>" +
						"<span class='badge' style='color:" +
						color +
						";border-color:" +
						color +
						"'>" +
						n.class +
						"</span>" +
						mvpBadge +
						"</div>" +
						"<div class='meta' style='margin-bottom:10px'>" +
						esc(classDesc) +
						"</div>" +
						"<h3>What it is / why it matters</h3><p>" +
						esc(n.summary) +
						"</p>" +
						"<h3>Mobile plan</h3><p>" +
						esc(n.mobilePlan) +
						"</p>" +
						(n.paths && n.paths.length
							? "<h3>Key paths</h3><ul class='paths'>" +
								n.paths
									.map(function (p) {
										return "<li><code>" + esc(p) + "</code></li>";
									})
									.join("") +
								"</ul>"
							: "") +
						(deps.length
							? "<h3>Depends on / feeds into</h3><ul>" +
								deps
									.map(function (d) {
										return "<li>" + d + "</li>";
									})
									.join("") +
								"</ul>"
							: "") +
						(dependents.length
							? "<h3>Consumed by</h3><ul>" +
								dependents
									.map(function (d) {
										return "<li>" + d + "</li>";
									})
									.join("") +
								"</ul>"
							: "");
					sidebar.classList.add("open");
				}

				let dragging = false,
					moved = false,
					last = { x: 0, y: 0 };

				canvas.addEventListener("mousedown", function (e) {
					dragging = true;
					moved = false;
					last = { x: e.clientX, y: e.clientY };
					canvas.classList.add("dragging");
				});
				window.addEventListener("mousemove", function (e) {
					if (dragging) {
						const dx = e.clientX - last.x,
							dy = e.clientY - last.y;
						if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
						view.x += dx;
						view.y += dy;
						last = { x: e.clientX, y: e.clientY };
						draw();
					} else {
						const n = nodeAt(e.clientX, e.clientY);
						if (n !== hovered) {
							hovered = n;
							canvas.style.cursor = n ? "pointer" : "grab";
							draw();
						}
					}
				});
				window.addEventListener("mouseup", function (e) {
					canvas.classList.remove("dragging");
					if (dragging && !moved) {
						const n = nodeAt(e.clientX, e.clientY);
						if (n && nodeVisible(n)) {
							selected = n;
							openSidebar(n);
						} else {
							selected = null;
							sidebar.classList.remove("open");
						}
						draw();
					}
					dragging = false;
				});

				canvas.addEventListener(
					"wheel",
					function (e) {
						e.preventDefault();
						const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
						const newScale = Math.min(Math.max(view.scale * factor, 0.15), 3);
						const wx = (e.clientX - view.x) / view.scale;
						const wy = (e.clientY - view.y) / view.scale;
						view.scale = newScale;
						view.x = e.clientX - wx * newScale;
						view.y = e.clientY - wy * newScale;
						draw();
					},
					{ passive: false },
				);

				let pinchDist = null;
				canvas.addEventListener(
					"touchstart",
					function (e) {
						if (e.touches.length === 1) {
							dragging = true;
							moved = false;
							last = { x: e.touches[0].clientX, y: e.touches[0].clientY };
						} else if (e.touches.length === 2) {
							pinchDist = Math.hypot(
								e.touches[0].clientX - e.touches[1].clientX,
								e.touches[0].clientY - e.touches[1].clientY,
							);
						}
					},
					{ passive: true },
				);
				canvas.addEventListener(
					"touchmove",
					function (e) {
						if (e.touches.length === 1 && dragging) {
							const dx = e.touches[0].clientX - last.x,
								dy = e.touches[0].clientY - last.y;
							if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
							view.x += dx;
							view.y += dy;
							last = { x: e.touches[0].clientX, y: e.touches[0].clientY };
							draw();
						} else if (e.touches.length === 2 && pinchDist) {
							const d = Math.hypot(
								e.touches[0].clientX - e.touches[1].clientX,
								e.touches[0].clientY - e.touches[1].clientY,
							);
							const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
							const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
							const factor = d / pinchDist;
							const newScale = Math.min(Math.max(view.scale * factor, 0.15), 3);
							const wx = (cx - view.x) / view.scale,
								wy = (cy - view.y) / view.scale;
							view.scale = newScale;
							view.x = cx - wx * newScale;
							view.y = cy - wy * newScale;
							pinchDist = d;
							draw();
						}
						e.preventDefault();
					},
					{ passive: false },
				);
				canvas.addEventListener("touchend", function (e) {
					if (dragging && !moved && e.changedTouches.length === 1) {
						const t = e.changedTouches[0];
						const n = nodeAt(t.clientX, t.clientY);
						if (n && nodeVisible(n)) {
							selected = n;
							openSidebar(n);
						} else {
							selected = null;
							sidebar.classList.remove("open");
						}
						draw();
					}
					dragging = false;
					pinchDist = null;
				});

				document.getElementById("sidebarClose").addEventListener("click", function () {
					sidebar.classList.remove("open");
					selected = null;
					draw();
				});
				document.getElementById("resetView").addEventListener("click", function () {
					fitView();
					draw();
				});
				mvpToggle.addEventListener("change", function () {
					mvpOnly = mvpToggle.checked;
					if (selected && !nodeVisible(selected)) {
						selected = null;
						sidebar.classList.remove("open");
					}
					draw();
				});
				window.addEventListener("resize", resize);

				fitView();
				resize();
			})();
		</script>
	</body>
</html>
