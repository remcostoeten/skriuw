name: Release Desktop

# Builds the Tauri desktop app and produces all three Linux variants:
#   .deb  (Debian/Ubuntu)   .rpm  (Fedora/RHEL/openSUSE)   .AppImage (portable)
#
# Triggers:
#   - push a tag like `desktop-v0.1.0`  -> builds + attaches artifacts to a GitHub release
#   - manual `workflow_dispatch`        -> builds only (no release), for verifying the pipeline
on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

# A newer push for the same ref cancels the in-flight run instead of building twice.
concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    # Build on the oldest supported runner: linking against an older glibc means
    # the artifacts run on more distros. webkit2gtk-4.1 is available on 22.04.
    runs-on: ubuntu-22.04
    permissions:
      contents: write # needed to create/update the GitHub release on tag pushes

    env:
      # Incremental compilation only helps repeated local builds; in CI it just
      # bloats the cache. Off = smaller cache, faster restore.
      CARGO_INCREMENTAL: "0"
      # Link with mold instead of GNU ld — by far the largest single speedup for
      # a Tauri release build (linking dominates once deps are cached).
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so release notes can diff against the previous tag.
          fetch-depth: 0

      # System libraries Tauri needs on Linux. `appindicator` is required by the
      # `tray-icon` Cargo feature; `patchelf` + `libfuse2` are required to build
      # and run the AppImage; `mold` is the fast linker used via RUSTFLAGS.
      # `--no-install-recommends` keeps the apt step lean.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf \
            libfuse2 \
            file \
            mold

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Caches the Cargo registry and the src-tauri/target dir, keyed on Cargo.lock
      # + rustc version. Unchanged Rust deps are restored instead of recompiled.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          # Keep distinct caches per OS/runner so they never clobber each other.
          key: ubuntu-22.04

      # Tauri downloads the AppImage build tooling (linuxdeploy, appimagetool,
      # the GTK plugin) into ~/.cache/tauri on the first AppImage build. Cache it
      # so later runs skip the downloads entirely.
      - name: Cache Tauri bundler tooling
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: tauri-bundler-${{ runner.os }}

      # bun caches downloaded packages between runs (~/.bun/install/cache).
      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # Build the release body from commit activity since the previous desktop
      # tag (only changes touching the desktop app / shared SPA / this workflow),
      # plus a compare link. Falls back to all history for the very first tag.
      - name: Generate release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${{ github.ref_name }}"
          PREV="$(git describe --tags --abbrev=0 --match 'desktop-v*' "${TAG}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then RANGE="${PREV}..${TAG}"; else RANGE="$TAG"; fi
          PATHS="apps/desktop packages/web-spa .github/workflows/release-desktop.yml"
          {
            echo "body<<RELEASE_EOF"
            echo "## What's changed"
            echo ""
            git log --no-merges --pretty='- %s (%h)' "$RANGE" -- $PATHS || true
            echo ""
            echo "### Install"
            echo "- **Debian/Ubuntu**: download the \`.deb\`"
            echo "- **Fedora/RHEL/openSUSE**: download the \`.rpm\`"
            echo "- **Any distro (portable)**: download the \`.AppImage\`, \`chmod +x\` it, and run"
            echo ""
            if [ -n "$PREV" ]; then
              echo "**Full changelog**: https://github.com/${{ github.repository }}/compare/${PREV}...${TAG}"
            fi
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

      # tauri-action runs the frontend build (beforeBuildCommand -> web-spa) and
      # `tauri build`, then uploads the bundles. On a tag push it creates/updates
      # the matching GitHub release; on workflow_dispatch it just builds.
      - name: Build desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: bun run tauri
          # Only publish a release when a desktop tag triggered the run.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Skriuw Desktop {0}', github.ref_name) || '' }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false

      # On manual runs there is no release, so expose the artifacts for download.
      - name: Upload artifacts (manual runs)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: skriuw-desktop-linux
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage

      # Track bundle sizes, LoC, and file counts.
      # Appends to docs/ app-size-table.mdx, generates diff reports on meaningful changes.
      - name: Track build metrics
        run: bash scripts/track-build.sh

      # Commit tracking data back to the repo so history is preserved. A tag
      # push checks out a detached HEAD, so there is no current branch to
      # `git push` to — push straight to daddy instead.
      - name: Commit build metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/docs_for_docs.skriuw.app/app-size-table.mdx
          git add docs/docs_for_docs.skriuw.app/build-diffs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: track build metrics for ${{ github.ref_name }}"
            git push origin HEAD:daddy
          fi
