name: Release Desktop

# Builds the Tauri desktop app for every platform:
#   Linux : .deb (Debian/Ubuntu)  .rpm (Fedora/RHEL)  .AppImage (portable)
#   macOS : universal .dmg (Apple silicon + Intel)
#   Windows: NSIS -setup.exe
#
# Triggers:
#   - push a tag like `desktop-v0.1.0`  -> creates a draft release with
#     generated notes, builds all platforms, attaches the artifacts
#   - manual `workflow_dispatch`        -> builds only (no release), for
#     verifying the pipeline
#
# Publishing the draft release then triggers publish-linux-repos.yml, which
# fans the artifacts out to apt / AUR / Homebrew / winget / Snap.
on:
    push:
        tags:
            - "desktop-v*"
    workflow_dispatch:

# A newer push for the same ref cancels the in-flight run instead of building twice.
concurrency:
    group: release-desktop-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Creates the draft release up front (with notes diffed against the
    # previous desktop tag) so the three build jobs below only ever *attach*
    # artifacts — no race over who creates the release or owns its body.
    create-release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  # Full history so release notes can diff against the previous tag.
                  fetch-depth: 0

            - name: Create draft release with generated notes
              if: startsWith(github.ref, 'refs/tags/')
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  TAG="${{ github.ref_name }}"
                  bash scripts/generate-release-notes.sh "$TAG" "${{ github.repository }}" > notes.md
                  if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
                    gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file notes.md
                  else
                    gh release create "$TAG" --repo "${{ github.repository }}" \
                      --draft --title "Skriuw Desktop $TAG" --notes-file notes.md
                  fi

            - name: Skip (manual run, no release)
              if: ${{ !startsWith(github.ref, 'refs/tags/') }}
              run: echo "workflow_dispatch run — building without a release."

    build-linux:
        needs: create-release
        # Build on the oldest supported runner: linking against an older glibc means
        # the artifacts run on more distros. webkit2gtk-4.1 is available on 22.04.
        runs-on: ubuntu-22.04
        permissions:
            contents: write # needed to upload artifacts to the release on tag pushes

        env:
            # Incremental compilation only helps repeated local builds; in CI it just
            # bloats the cache. Off = smaller cache, faster restore.
            CARGO_INCREMENTAL: "0"
            # Link with mold instead of GNU ld — by far the largest single speedup for
            # a Tauri release build (linking dominates once deps are cached).
            RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
            CARGO_TERM_COLOR: always

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            # System libraries Tauri needs on Linux. `appindicator` is required by the
            # `tray-icon` Cargo feature; `patchelf` + `libfuse2` are required to build
            # and run the AppImage; `mold` is the fast linker used via RUSTFLAGS.
            # `--no-install-recommends` keeps the apt step lean.
            - name: Install Linux build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    libwebkit2gtk-4.1-dev \
                    libgtk-3-dev \
                    librsvg2-dev \
                    libayatana-appindicator3-dev \
                    patchelf \
                    libfuse2 \
                    file \
                    mold

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.14"

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            # Caches the Cargo registry and the src-tauri/target dir, keyed on Cargo.lock
            # + rustc version. Unchanged Rust deps are restored instead of recompiled.
            - name: Cache Rust build
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: apps/desktop/src-tauri
                  # Keep distinct caches per OS/runner so they never clobber each other.
                  key: ubuntu-22.04

            # Tauri downloads the AppImage build tooling (linuxdeploy, appimagetool,
            # the GTK plugin) into ~/.cache/tauri on the first AppImage build. Cache it
            # so later runs skip the downloads entirely.
            - name: Cache Tauri bundler tooling
              uses: actions/cache@v4
              with:
                  path: ~/.cache/tauri
                  key: tauri-bundler-${{ runner.os }}

            # bun caches downloaded packages between runs (~/.bun/install/cache).
            - name: Install JS dependencies
              run: bun install --frozen-lockfile

            # tauri-action runs the frontend build (beforeBuildCommand -> web-spa) and
            # `tauri build`, then uploads the bundles to the draft release created by
            # the create-release job. On workflow_dispatch it just builds.
            - name: Build desktop app
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  projectPath: apps/desktop
                  tauriScript: bun run tauri
                  # Only attach to a release when a desktop tag triggered the run.
                  tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
                  releaseDraft: true
                  prerelease: false

            # On manual runs there is no release, so expose the artifacts for download.
            - name: Upload artifacts (manual runs)
              if: ${{ github.event_name == 'workflow_dispatch' }}
              uses: actions/upload-artifact@v4
              with:
                  name: skriuw-desktop-linux
                  if-no-files-found: error
                  path: |
                      apps/desktop/src-tauri/target/release/bundle/deb/*.deb
                      apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
                      apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage

            # Track bundle sizes, LoC, and file counts.
            # Appends to docs/ app-size-table.mdx, generates diff reports on meaningful changes.
            - name: Track build metrics
              run: bash scripts/track-build.sh

            # Commit tracking data back to the repo so history is preserved. A tag
            # push checks out a detached HEAD, so there is no current branch to
            # `git push` to — push straight to daddy instead. Tags cut from a
            # feature branch aren't fast-forwards of daddy, so a rejected push is
            # a warning, not a build failure (the release artifacts are already
            # uploaded by this point).
            - name: Commit build metrics
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add docs/docs_for_docs.skriuw.app/app-size-table.mdx
                  git add docs/docs_for_docs.skriuw.app/build-diffs/
                  if git diff --cached --quiet; then
                    echo "No changes to commit"
                  elif git commit -m "chore: track build metrics for ${{ github.ref_name }}" \
                      && git push origin HEAD:daddy; then
                    echo "Metrics pushed to daddy"
                  else
                    echo "::warning::could not push build metrics to daddy (tag not a fast-forward?); skipping"
                  fi

    build-macos:
        needs: create-release
        runs-on: macos-latest
        permissions:
            contents: write
        env:
            CARGO_INCREMENTAL: "0"
            CARGO_TERM_COLOR: always
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.14"

            # Both Apple targets so `--target universal-apple-darwin` can lipo a
            # single .dmg that runs on Apple silicon and Intel.
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-apple-darwin,x86_64-apple-darwin

            - name: Cache Rust build
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: apps/desktop/src-tauri
                  key: macos-universal

            - name: Install JS dependencies
              run: bun install --frozen-lockfile

            # The .dmg is unsigned/un-notarized (no Apple Developer account); the
            # Homebrew cask strips the quarantine attribute on install instead.
            - name: Build desktop app (universal .dmg)
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  projectPath: apps/desktop
                  tauriScript: bun run tauri
                  args: --target universal-apple-darwin --bundles dmg
                  tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
                  releaseDraft: true
                  prerelease: false

            - name: Upload artifacts (manual runs)
              if: ${{ github.event_name == 'workflow_dispatch' }}
              uses: actions/upload-artifact@v4
              with:
                  name: skriuw-desktop-macos
                  if-no-files-found: error
                  path: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

    build-windows:
        needs: create-release
        runs-on: windows-latest
        permissions:
            contents: write
        env:
            CARGO_INCREMENTAL: "0"
            CARGO_TERM_COLOR: always
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.14"

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache Rust build
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: apps/desktop/src-tauri
                  key: windows

            - name: Install JS dependencies
              run: bun install --frozen-lockfile

            # NSIS produces the `Skriuw_<version>_x64-setup.exe` that the winget
            # manifest points at. Unsigned; SmartScreen will warn until the
            # package builds reputation or a signing cert is added.
            - name: Build desktop app (NSIS installer)
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  projectPath: apps/desktop
                  tauriScript: bun run tauri
                  args: --bundles nsis
                  tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
                  releaseDraft: true
                  prerelease: false

            - name: Upload artifacts (manual runs)
              if: ${{ github.event_name == 'workflow_dispatch' }}
              uses: actions/upload-artifact@v4
              with:
                  name: skriuw-desktop-windows
                  if-no-files-found: error
                  path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
