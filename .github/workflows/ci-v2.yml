name: CI v2

on:
    push:
        branches:
            - daddy
            - master
        paths-ignore:
            - "v1/**"
    pull_request:
        paths-ignore:
            - "v1/**"

permissions:
    contents: read

jobs:
    portable-wasm:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v5
              with:
                  persist-credentials: false

            - name: Install declared Rust toolchain
              run: rustup show active-toolchain

            - name: Cache Cargo
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: . -> target

            - name: Install wasm-bindgen-cli
              run: |
                  curl --location --silent --show-error --fail \
                      https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.126/wasm-bindgen-0.2.126-x86_64-unknown-linux-musl.tar.gz \
                      | tar --extract --gzip --strip-components=1 --directory="$HOME/.cargo/bin" \
                            wasm-bindgen-0.2.126-x86_64-unknown-linux-musl/wasm-bindgen
                  wasm-bindgen --version

            - name: Install bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "24"

            - name: Install app deps
              run: bun install --frozen-lockfile

            - name: Verify portable Rust crates
              run: ./bin/check browser

    verify-and-build:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v5

            - name: Install Tauri system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy, rustfmt

            - name: Cache Cargo
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: |
                      . -> target
                      apps/workspace/src-tauri -> target

            - name: Install wasm-bindgen-cli
              run: |
                  curl --location --silent --show-error --fail \
                      https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.126/wasm-bindgen-0.2.126-x86_64-unknown-linux-musl.tar.gz \
                      | tar --extract --gzip --strip-components=1 --directory="$HOME/.cargo/bin" \
                            wasm-bindgen-0.2.126-x86_64-unknown-linux-musl/wasm-bindgen
                  wasm-bindgen --version

            - name: Install bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "24"

            - name: Install frontend deps
              run: |
                  bun install --frozen-lockfile
                  (cd services/sync && bun install --frozen-lockfile)
                  (cd apps/workspace/harnesses/ui-architecture && bun install --frozen-lockfile)
                  (cd apps/workspace/harnesses/renderer-store && bun install --frozen-lockfile)

            - name: Verify and build
              # Updater artifacts are only signed in the release workflow; CI builds skip them
              run: ./bin/build ci --config '{"bundle":{"createUpdaterArtifacts":false}}'

            - name: Upload build logs
              if: failure()
              uses: actions/upload-artifact@v5
              with:
                  name: skriuw-v2-build-logs
                  if-no-files-found: warn
                  path: .build/logs
