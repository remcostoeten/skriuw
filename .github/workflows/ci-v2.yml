name: CI v2

on:
    push:
        branches:
            - daddy
            - master
        paths:
            - "v2/**"
            - ".github/workflows/ci-v2.yml"
    pull_request:
        paths:
            - "v2/**"
            - ".github/workflows/ci-v2.yml"

permissions:
    contents: read
    pull-requests: read

# Superseded pull request runs are pointless once a newer commit exists. Pushes
# group by run id, which never collides, so a release branch build is never
# cancelled by a later push.
concurrency:
    group: ci-v2-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: true

jobs:
    verify-and-build:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        defaults:
            run:
                working-directory: v2
        steps:
            - uses: actions/checkout@v5

            - name: Install Tauri system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy, rustfmt

            - name: Cache Cargo
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: |
                      v2 -> target
                      v2/app/src-tauri -> target

            - name: Install bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "24"

            - name: Install frontend deps
              # bun ignores --cwd on the install subcommand, so cd into each dir
              run: |
                  (cd app && bun install --frozen-lockfile)
                  (cd spikes/ui-architecture && bun install --frozen-lockfile)
                  (cd spikes/renderer-store && bun install --frozen-lockfile)

            # A release workspace build plus a full Tauri bundle is ~7 of the ~10
            # minutes this job takes, and no pull request consumes the artifacts.
            # Pull requests build the renderer only; the release path still runs
            # on pushes, and on any pull request that touches Rust or Tauri.
            - name: Select build mode
              id: mode
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR: ${{ github.event.pull_request.number }}
              run: |
                  if [[ -z "$PR" ]]; then
                    echo "mode=ci" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  changed="$(gh api "repos/${{ github.repository }}/pulls/$PR/files" \
                    --paginate --jq '.[].filename')"
                  rust='^v2/(app/src-tauri/|crates/|xtask/|Cargo\.(toml|lock)$|rust-toolchain\.toml$)'
                  if grep -qE "$rust"'|^\.github/workflows/ci-v2\.yml$' <<<"$changed"; then
                    echo "mode=ci" >> "$GITHUB_OUTPUT"
                  else
                    echo "mode=web" >> "$GITHUB_OUTPUT"
                  fi

            - name: Verify and build
              # Updater artifacts are only signed in the release workflow; CI builds skip them
              run: |
                  if [[ "${{ steps.mode.outputs.mode }}" == "ci" ]]; then
                    ./scripts/build.sh ci --config '{"bundle":{"createUpdaterArtifacts":false}}'
                  else
                    ./scripts/build.sh web
                  fi

            - name: Upload build logs
              if: failure()
              uses: actions/upload-artifact@v5
              with:
                  name: skriuw-v2-build-logs
                  if-no-files-found: warn
                  path: v2/.build/logs
