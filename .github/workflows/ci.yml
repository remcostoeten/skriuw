name: CI

on:
  push:
    branches:
      - daddy
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests with coverage
        run: bun scripts/coverage-tui.ts --json coverage.json --markdown >> "$GITHUB_STEP_SUMMARY"
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json
          path: coverage.json
          if-no-files-found: warn

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
          BETTER_AUTH_SECRET: ci-build-secret-minimum-32-characters
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
          AI_KEYS_ENCRYPTION_SECRET: ci-ai-keys-encryption-secret-32c
