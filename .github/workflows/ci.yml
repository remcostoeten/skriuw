name: CI

on:
    push:
        branches:
            - daddy
            - master
        paths-ignore:
            - "v2/**"
    pull_request:
        paths-ignore:
            - "v2/**"

permissions:
    contents: read
    pull-requests: write

jobs:
    desktop-check:
        name: Desktop verification
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            # Keep this list aligned with release-desktop.yml's Linux Tauri dependencies.
            - name: Install Linux build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    libwebkit2gtk-4.1-dev \
                    libgtk-3-dev \
                    librsvg2-dev \
                    libayatana-appindicator3-dev

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.14"

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt,clippy

            - name: Cache Rust dependencies
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: apps/desktop/src-tauri
                  key: desktop-check

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run desktop verification
              run: bash scripts/check-desktop.sh full

            - name: Upload desktop bundle report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: desktop-bundle-report
                  if-no-files-found: warn
                  path: |
                      packages/web-spa/dist/.vite/manifest.json
                      packages/web-spa/dist/desktop-bundle-report.json

    mobile:
        name: Mobile typecheck and lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.14"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Check Expo app
              run: bun run mobile:check

    test:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_USER: ci
                    POSTGRES_PASSWORD: ci
                    POSTGRES_DB: ci
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U ci -d ci"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.14"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Apply database migrations
              run: bunx prisma migrate deploy
              env:
                  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable

            - name: Unit tests with coverage
              run: bun scripts/coverage-tui.ts --json coverage.json --markdown coverage.md --threshold=65
              env:
                  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable

            - name: Append coverage report to summary
              if: always()
              run: cat coverage.md >> "$GITHUB_STEP_SUMMARY"

            - name: Upload coverage artifacts
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-reports
                  path: |
                      coverage.json
                      coverage.md
                  if-no-files-found: warn

            - name: Comment coverage on PR
              if: github.event_name == 'pull_request' && always()
              continue-on-error: true
              uses: actions/github-script@v9
              with:
                  script: |
                      const fs = require('fs');
                      const coverage = fs.readFileSync('coverage.md', 'utf8');
                      github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: coverage
                      });

            - name: Typecheck
              run: bun run typecheck

            - name: Lint
              run: bun run lint

            - name: Production build
              run: bun run build
              env:
                  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
                  BETTER_AUTH_SECRET: ci-build-secret-minimum-32-characters
                  BETTER_AUTH_URL: http://localhost:3000
                  NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
                  AI_KEYS_ENCRYPTION_SECRET: ci-ai-keys-encryption-secret-32c

            - name: Documentation typecheck
              run: bun run --cwd apps/documentation typecheck

    deploy-docs:
        name: Deploy docs
        needs: test
        runs-on: ubuntu-latest
        # Vercel builds remotely, so this only needs the repo + the CLI.
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
                  # Needed so the path filter can diff against the base commit.
                  fetch-depth: 0

            - name: Check whether the docs changed
              id: changed
              run: |
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                      base="${{ github.event.pull_request.base.sha }}"
                  else
                      base="${{ github.event.before }}"
                  fi
                  # First push to a branch has a null base; treat as changed.
                  if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
                      echo "result=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  if git diff --quiet "$base" HEAD -- apps/documentation docs package.json bun.lock; then
                      echo "result=false" >> "$GITHUB_OUTPUT"
                      echo "No docs changes — skipping deploy."
                  else
                      echo "result=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Deploy to Vercel
              if: steps.changed.outputs.result == 'true'
              id: deploy
              env:
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
                  # `daddy` publishes to docs.skriuw.com; every other ref gets a
                  # throwaway preview URL.
                  PROD: ${{ github.ref == 'refs/heads/daddy' && '--prod' || '' }}
              run: |
                  url=$(npx vercel@latest deploy $PROD --yes \
                      --token "${{ secrets.VERCEL_TOKEN }}")
                  echo "url=$url" >> "$GITHUB_OUTPUT"
                  echo "Deployed: $url"

            - name: Comment preview URL on the PR
              if: >-
                  steps.changed.outputs.result == 'true' &&
                  github.event_name == 'pull_request'
              uses: actions/github-script@v9
              with:
                  script: |
                      github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: `📚 Docs preview: ${{ steps.deploy.outputs.url }}`
                      });
