name: publish v2

on:
    push:
        tags:
            - "v2-v*"
    workflow_dispatch:
        inputs:
            skip_cloud_gate:
                description: "Publish without verifying the deployed Worker's sync capabilities"
                required: false
                default: false
                type: boolean

jobs:
    # clients read the workspace encryption record before every push that has
    # queued changes, so publishing a release the deployed Worker cannot serve
    # is what turns a rollout into an outage
    verify-cloud:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: "24"

            - name: Warn that the cloud capability gate was skipped
              if: ${{ inputs.skip_cloud_gate }}
              run: |
                  echo "::warning title=Cloud capability gate skipped::This release is being published WITHOUT verifying that the production Worker serves the sync capabilities these clients require."

            - name: Verify production Worker capabilities
              if: ${{ !inputs.skip_cloud_gate }}
              run: node scripts/verify-cloud-capabilities.mjs https://skriuw-v2-cloud.remcostoeten.workers.dev

    # tauri-action's matrix jobs each create a draft when none exists, splitting
    # assets across duplicate releases; creating the draft once up front avoids that
    create-release:
        permissions:
            contents: write
        runs-on: ubuntu-latest
        outputs:
            release_id: ${{ steps.create.outputs.result }}
        steps:
            - name: Create draft release
              id: create
              uses: actions/github-script@v7
              with:
                  script: |
                      const { data } = await github.rest.repos.createRelease({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          tag_name: process.env.GITHUB_REF_NAME,
                          name: `Skriuw ${process.env.GITHUB_REF_NAME}`,
                          draft: true,
                      });
                      return data.id;

    # the generated WASM bindings are platform-independent; Apple clang and
    # ubuntu-22.04's clang cannot compile the sqlite-wasm-rs C shim for
    # wasm32, so build once where CI already proves it works and share it
    build-browser-wasm:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Setup Rust toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: 1.95.0
                  targets: wasm32-unknown-unknown

            - name: Rust cache
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: . -> target

            - name: Install wasm-bindgen-cli
              run: |
                  curl --location --silent --show-error --fail \
                      https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.126/wasm-bindgen-0.2.126-x86_64-unknown-linux-musl.tar.gz \
                      | tar --extract --gzip --strip-components=1 --directory="$HOME/.cargo/bin" \
                            wasm-bindgen-0.2.126-x86_64-unknown-linux-musl/wasm-bindgen
                  wasm-bindgen --version

            - name: Build browser WASM bindings
              run: ./scripts/build-browser-wasm.sh

            - uses: actions/upload-artifact@v4
              with:
                  name: browser-wasm
                  path: .build/browser-wasm
                  if-no-files-found: error

    publish-tauri:
        needs: [create-release, build-browser-wasm]
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: "macos-latest"
                      args: "--target aarch64-apple-darwin"
                    - platform: "macos-latest"
                      args: "--target x86_64-apple-darwin"
                    - platform: "ubuntu-22.04"
                      args: ""
                    - platform: "windows-latest"
                      args: ""

        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/checkout@v5

            - name: Install dependencies (Ubuntu only)
              if: matrix.platform == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Setup Rust toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: 1.95.0
                  targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - name: Rust cache
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: |
                      . -> target
                      app/src-tauri -> target

            # the desktop frontend bundles the browser storage worker, whose
            # generated WASM bindings must exist before `build:frontend` typechecks
            - name: Download browser WASM bindings
              uses: actions/download-artifact@v4
              with:
                  name: browser-wasm
                  path: .build/browser-wasm

            - name: Install frontend dependencies
              working-directory: app
              run: bun install --frozen-lockfile

            - name: Build and release
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
                  NO_STRIP: 1
              with:
                  projectPath: "./app"
                  # the default `bun run tauri` script routes through the bash verification
                  # wrapper, which breaks on Windows and re-runs the suite CI already ran
                  tauriScript: "bun run tauri:cli"
                  releaseId: ${{ needs.create-release.outputs.release_id }}
                  includeUpdaterJson: true
                  args: ${{ matrix.args }}

    # publishing the draft is what starts the Tauri updater and the package
    # channels, so it happens only once every artifact exists and the deployed
    # Worker has been verified
    publish-release:
        needs: [verify-cloud, build-browser-wasm, publish-tauri]
        permissions:
            contents: write
        runs-on: ubuntu-latest
        steps:
            - name: Publish the draft release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
              run: gh release edit "$GITHUB_REF_NAME" --draft=false
