name: Mobile CI

# The path filter is the whole cost contract: a PR that touches none of these
# starts no mobile job, so desktop CI time does not grow. Tag pushes ignore
# `paths`, which is what lets a `mobile-v*` tag produce the preview builds.
on:
    push:
        branches:
            - daddy
        tags:
            - "mobile-v*"
        paths: &mobile-paths
            - "apps/mobile/**"
            - "packages/renderer-core/**"
            - "packages/theme/**"
            - "packages/icons/**"
            - "crates/skriuw-mobile/**"
            - "__tests__/apps/mobile/**"
            - "__tests__/packages/theme/**"
            - "__tests__/packages/icons/**"
            - "__tests__/support/**"
            - "vitest.config.ts"
            - "bin/check"
            - "tools/scripts/check-mobile.sh"
            - "tools/scripts/check-test-layout.sh"
            - ".github/workflows/mobile-*.yml"
            - "!**/*.md"
    pull_request:
        paths: *mobile-paths
    workflow_dispatch:
        inputs:
            targets:
                description: "ipa: gate and the unsigned iOS build. android: gate, emulator e2e and the APK. all: every job, including EAS."
                type: choice
                options:
                    - ipa
                    - android
                    - all
                default: all

permissions:
    contents: read

concurrency:
    group: mobile-ci-${{ github.ref }}-${{ inputs.targets || 'auto' }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Naming the shell is what turns on `pipefail`; the implicit default is
# `bash -e`, under which a failed command piped into `tee` passes the step.
defaults:
    run:
        shell: bash

env:
    MODULE_DIR: apps/mobile/modules/skriuw-core
    NDK_VERSION: 27.1.12297006
    BUN_VERSION: "1.4.2"
    EAS_CLI_VERSION: "27.2.0"
    XCODE_VERSION: "26.6"

jobs:
    changes:
        name: Select jobs
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            pull-requests: read
        outputs:
            ios: ${{ steps.select.outputs.ios }}
            ipa: ${{ steps.select.outputs.ipa }}
            android_e2e: ${{ steps.select.outputs.android_e2e }}
            android_preview: ${{ steps.select.outputs.android_preview }}
            eas: ${{ steps.select.outputs.eas }}
        steps:
            - uses: actions/checkout@v5
              if: github.event_name == 'push' && github.ref_type == 'branch'
              with:
                  persist-credentials: false

            - id: native
              if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
              uses: dorny/paths-filter@v4.0.3
              with:
                  filters: |
                      native:
                          - "apps/mobile/modules/**"
                          - "apps/mobile/src/bridge/**"
                          - "apps/mobile/src/**/plugin.js"
                          - "apps/mobile/src/features/capture/share-extension/**"
                          - "apps/mobile/src/features/quick-actions/actions.json"
                          - "apps/mobile/package.json"
                          - "apps/mobile/app.json"
                          - "crates/skriuw-mobile/**"
                          - "bun.lock"
                          - ".github/workflows/mobile-*.yml"

            - id: select
              env:
                  EVENT: ${{ github.event_name }}
                  REF_TYPE: ${{ github.ref_type }}
                  TARGETS: ${{ inputs.targets }}
                  NATIVE: ${{ steps.native.outputs.native }}
              run: |
                  case "$EVENT" in
                      workflow_dispatch) targets="${TARGETS:-all}" ;;
                      push) if [[ "$REF_TYPE" == "tag" ]]; then targets="all"; else targets="changes"; fi ;;
                      *) targets="changes" ;;
                  esac
                  native="${NATIVE:-false}"
                  ios=false ipa=false android_e2e=false android_preview=false eas=false
                  case "$targets" in
                      all) ios=true ipa=true android_e2e=true android_preview=true eas=true ;;
                      ipa) ios=true ipa=true ;;
                      android) android_e2e=true android_preview=true ;;
                      changes)
                          ios=true
                          android_e2e="$native"
                          if [[ "$EVENT" == "push" ]]; then ipa="$native"; fi
                          ;;
                      *) echo "::error::Unknown targets value: $targets"; exit 1 ;;
                  esac
                  printf 'targets=%s native=%s\n' "$targets" "$native"
                  {
                      echo "ios=$ios"
                      echo "ipa=$ipa"
                      echo "android_e2e=$android_e2e"
                      echo "android_preview=$android_preview"
                      echo "eas=$eas"
                  } >> "$GITHUB_OUTPUT"

    gate:
        name: Product gate
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v5
              with:
                  persist-credentials: false

            - name: Install declared Rust toolchain
              run: rustup show active-toolchain

            - name: Cache Cargo
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: . -> target
                  shared-key: mobile-host

            - name: Install bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Install Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "24"

            - name: Install workspace deps
              run: bun install --frozen-lockfile

            - name: Mobile product gate
              run: ./bin/check mobile

            - name: Facade host tests
              run: cargo test -p skriuw-mobile --locked

            - name: Bundle the iOS JavaScript
              working-directory: apps/mobile
              run: bunx expo export --platform ios --output-dir "$RUNNER_TEMP/export"

    android-e2e:
        name: Android emulator e2e
        needs: changes
        if: needs.changes.outputs.android_e2e == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 75
        env:
            GRADLE_OPTS: -Dorg.gradle.caching=true
        steps:
            - uses: actions/checkout@v5
              with:
                  persist-credentials: false

            # Hosted runners expose KVM to root only; the emulator is unusably
            # slow without it.
            - name: Enable KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm

            - name: Install Java
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "17"

            - id: core
              name: Restore the Rust core for Android
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ env.MODULE_DIR }}/android/src/main/jniLibs
                      ${{ env.MODULE_DIR }}/android/src/main/java/uniffi
                  key: mobile-core-android-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'apps/mobile/modules/skriuw-core/scripts/build-android.sh') }}

            - name: Install Android Rust targets
              if: steps.core.outputs.cache-hit != 'true'
              run: |
                  rustup show active-toolchain
                  rustup target add aarch64-linux-android x86_64-linux-android

            - name: Cache Cargo
              if: steps.core.outputs.cache-hit != 'true'
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: |
                      . -> target
                      crates/skriuw-mobile/bindgen -> target
                  shared-key: mobile-android

            - name: Install cargo-ndk
              if: steps.core.outputs.cache-hit != 'true'
              uses: taiki-e/install-action@v2
              with:
                  tool: cargo-ndk

            - name: Install bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Install Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "24"

            - name: Install workspace deps
              run: bun install --frozen-lockfile

            - name: Cache Gradle
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                  key: mobile-gradle-${{ hashFiles('bun.lock') }}
                  restore-keys: mobile-gradle-

            # Gradle and the emulator action each download SDK packages without a
            # retry, and one truncated archive fails the whole job.
            - name: Install the NDK and emulator
              run: |
                  for _ in 1 2 3; do
                      if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" emulator; then
                          exit 0
                      fi
                      rm -rf "$ANDROID_HOME/ndk/$NDK_VERSION" "$ANDROID_HOME/emulator"
                      sleep 15
                  done
                  exit 1

            - name: Build the Rust core for Android
              if: steps.core.outputs.cache-hit != 'true'
              run: ${{ env.MODULE_DIR }}/scripts/build-android.sh

            - id: avd
              name: Cache the AVD snapshot
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.android/avd/*
                      ~/.android/adb*
                  key: mobile-avd-${{ runner.os }}-api34-x86_64-default

            - name: Create the AVD snapshot
              if: steps.avd.outputs.cache-hit != 'true'
              uses: reactivecircus/android-emulator-runner@v2
              with:
                  api-level: 34
                  arch: x86_64
                  target: default
                  disk-size: 6000M
                  force-avd-creation: false
                  disable-animations: false
                  emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
                  script: echo "Created the AVD snapshot"

            # Built before the emulator boots so Gradle does not share the
            # runner's cores with a software-rendered emulator.
            - name: Build the probe APK
              env:
                  SKRIUW_ANDROID_ABI: x86_64
              run: ${{ env.MODULE_DIR }}/scripts/e2e-android.sh build

            - name: Open, write, kill, relaunch, read back
              uses: reactivecircus/android-emulator-runner@v2
              with:
                  api-level: 34
                  arch: x86_64
                  target: default
                  disk-size: 6000M
                  force-avd-creation: false
                  disable-animations: true
                  emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
                  script: ${{ env.MODULE_DIR }}/scripts/e2e-android.sh run

    xcframework:
        name: iOS xcframework
        needs: changes
        if: needs.changes.outputs.ios == 'true'
        runs-on: macos-26
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v5
              with:
                  persist-credentials: false

            - name: Select Xcode
              run: |
                  sudo xcode-select --switch "/Applications/Xcode_$XCODE_VERSION.app"
                  xcodebuild -version

            - id: core
              name: Restore the Rust core for iOS
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ env.MODULE_DIR }}/ios/Frameworks
                      ${{ env.MODULE_DIR }}/ios/Generated
                  key: mobile-core-ios-${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'apps/mobile/modules/skriuw-core/scripts/build-ios.sh') }}

            - name: Install iOS Rust targets
              if: steps.core.outputs.cache-hit != 'true'
              run: |
                  rustup show active-toolchain
                  rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

            - name: Cache Cargo
              if: steps.core.outputs.cache-hit != 'true'
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: |
                      . -> target
                      crates/skriuw-mobile/bindgen -> target
                  shared-key: mobile-ios

            - name: Build SkriuwMobile.xcframework and the Swift bindings
              if: steps.core.outputs.cache-hit != 'true'
              run: ${{ env.MODULE_DIR }}/scripts/build-ios.sh

            # One artifact holding both directories, unpacked over
            # apps/mobile/modules/skriuw-core/ios before `pod install`.
            - uses: actions/upload-artifact@v4
              with:
                  name: skriuw-core-ios
                  path: |
                      ${{ env.MODULE_DIR }}/ios/Frameworks
                      ${{ env.MODULE_DIR }}/ios/Generated
                  if-no-files-found: error
                  retention-days: 30

    android-preview:
        name: Android preview build
        needs: [changes, gate]
        if: needs.changes.outputs.android_preview == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 75
        env:
            GRADLE_OPTS: -Dorg.gradle.caching=true
        steps:
            - uses: actions/checkout@v5
              with:
                  persist-credentials: false

            - name: Install Java
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "17"

            - id: core
              name: Restore the Rust core for Android
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ env.MODULE_DIR }}/android/src/main/jniLibs
                      ${{ env.MODULE_DIR }}/android/src/main/java/uniffi
                  key: mobile-core-android-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'apps/mobile/modules/skriuw-core/scripts/build-android.sh') }}

            - name: Install Android Rust targets
              if: steps.core.outputs.cache-hit != 'true'
              run: |
                  rustup show active-toolchain
                  rustup target add aarch64-linux-android x86_64-linux-android

            - name: Cache Cargo
              if: steps.core.outputs.cache-hit != 'true'
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: |
                      . -> target
                      crates/skriuw-mobile/bindgen -> target
                  shared-key: mobile-android

            - name: Install cargo-ndk
              if: steps.core.outputs.cache-hit != 'true'
              uses: taiki-e/install-action@v2
              with:
                  tool: cargo-ndk

            - name: Install bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Install Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "24"

            - name: Install workspace deps
              run: bun install --frozen-lockfile

            - name: Cache Gradle
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                  key: mobile-gradle-${{ hashFiles('bun.lock') }}
                  restore-keys: mobile-gradle-

            # Gradle downloads the NDK without a retry, and one truncated archive
            # fails the whole job.
            - name: Install the Gradle NDK
              run: |
                  for _ in 1 2 3; do
                      if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"; then
                          exit 0
                      fi
                      rm -rf "$ANDROID_HOME/ndk/$NDK_VERSION"
                      sleep 15
                  done
                  exit 1

            - name: Build the Rust core for Android
              if: steps.core.outputs.cache-hit != 'true'
              run: ${{ env.MODULE_DIR }}/scripts/build-android.sh

            # The Expo template signs release variants with the debug keystore,
            # so this APK installs on any device but is not a store build.
            - name: Assemble the preview APK
              working-directory: apps/mobile
              run: |
                  bunx expo prebuild --platform android --no-install
                  cd android
                  ./gradlew app:assembleRelease -x lint -x test -PreactNativeArchitectures=arm64-v8a,x86_64 "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

            - uses: actions/upload-artifact@v4
              with:
                  name: skriuw-android-preview
                  path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
                  if-no-files-found: error
                  retention-days: 30

    # A device build with signing turned off. iloader signs it with a free
    # Apple ID when it installs it; there is no Apple Developer team, so no
    # signed iOS build exists.
    ios-device-unsigned:
        name: iOS device build (unsigned)
        needs: [changes, gate, xcframework]
        if: needs.changes.outputs.ipa == 'true'
        runs-on: macos-26
        timeout-minutes: 75
        steps:
            - uses: actions/checkout@v5
              with:
                  persist-credentials: false

            - uses: actions/download-artifact@v5
              with:
                  name: skriuw-core-ios
                  path: ${{ env.MODULE_DIR }}/ios

            - name: Select Xcode
              run: |
                  sudo xcode-select --switch "/Applications/Xcode_$XCODE_VERSION.app"
                  xcodebuild -version

            - name: Install bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Install Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "24"

            - name: Install workspace deps
              run: bun install --frozen-lockfile

            # A release build embeds the JavaScript and the editor page, so the
            # app runs on the phone without Metro.
            - name: Build the editor page
              working-directory: apps/mobile
              run: bun run editor:page

            - id: ccache
              name: Install ccache
              env:
                  HOMEBREW_NO_AUTO_UPDATE: "1"
                  HOMEBREW_NO_INSTALL_CLEANUP: "1"
              run: |
                  brew install ccache
                  echo "dir=$(ccache --get-config cache_dir)" >> "$GITHUB_OUTPUT"

            - name: Cache ccache
              uses: actions/cache@v4
              with:
                  path: ${{ steps.ccache.outputs.dir }}
                  key: mobile-ccache-${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('bun.lock') }}
                  restore-keys: mobile-ccache-${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-

            - name: Generate the iOS project with ccache enabled
              working-directory: apps/mobile
              run: |
                  bunx expo prebuild --platform ios --no-install
                  jq '."apple.ccacheEnabled" = "true"' ios/Podfile.properties.json > "$RUNNER_TEMP/Podfile.properties.json"
                  mv "$RUNNER_TEMP/Podfile.properties.json" ios/Podfile.properties.json
                  cd ios
                  pod install

            - name: Build the unsigned device app
              working-directory: apps/mobile
              run: |
                  ccache --zero-stats
                  workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' | head -n 1)"
                  [[ -n "$workspace" ]] || { echo "::error::pod install produced no Xcode workspace"; exit 1; }
                  scheme="$(basename "$workspace" .xcworkspace)"
                  xcodebuild \
                      -workspace "$workspace" \
                      -scheme "$scheme" \
                      -configuration Release \
                      -sdk iphoneos \
                      -destination 'generic/platform=iOS' \
                      -derivedDataPath build \
                      CODE_SIGNING_ALLOWED=NO \
                      CODE_SIGNING_REQUIRED=NO \
                      CODE_SIGN_IDENTITY=""
                  app="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)"
                  [[ -n "$app" ]] || { echo "::error::xcodebuild produced no .app"; exit 1; }
                  mkdir -p "$RUNNER_TEMP/ipa/Payload"
                  cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
                  (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/skriuw-ios-unsigned.ipa" Payload)

            - name: Show ccache statistics and drop unused entries
              if: success() || failure()
              run: |
                  ccache --show-stats
                  ccache --evict-older-than 1d

            - uses: actions/upload-artifact@v4
              with:
                  name: skriuw-ios-unsigned-ipa
                  path: ${{ runner.temp }}/skriuw-ios-unsigned.ipa
                  if-no-files-found: error
                  retention-days: 30

    # Separate from the macOS build so the write token never reaches the
    # third-party scripts that `pod install` and xcodebuild run.
    ipa-release:
        name: Publish the IPA prerelease
        needs: ios-device-unsigned
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
        concurrency:
            group: mobile-ipa-release
            cancel-in-progress: false
        env:
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
            RELEASE_TAG: mobile-ipa-latest
        steps:
            - uses: actions/download-artifact@v5
              with:
                  name: skriuw-ios-unsigned-ipa
                  path: ${{ runner.temp }}/ipa

            - name: Replace the prerelease asset
              run: |
                  ipa="$RUNNER_TEMP/ipa/skriuw-ios-unsigned.ipa"
                  title="Skriuw iOS unsigned build ${GITHUB_SHA::7}"
                  notes="Unsigned iOS device build of $GITHUB_SHA from $GITHUB_REF_NAME, built by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Download it with ./bin/ipa latest and install it with iloader."
                  if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                      gh release upload "$RELEASE_TAG" "$ipa" --clobber
                      gh release edit "$RELEASE_TAG" --prerelease --title "$title" --notes "$notes"
                  else
                      gh release create "$RELEASE_TAG" "$ipa" --prerelease --latest=false --target "$GITHUB_SHA" --title "$title" --notes "$notes"
                  fi

    # Secrets are not readable in a job-level `if`, so this job turns the
    # preconditions into outputs. When one is missing the EAS job shows up as
    # skipped next to a warning annotation naming the reason, never as green.
    eas-preflight:
        name: EAS preconditions
        needs: changes
        if: needs.changes.outputs.eas == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            ready: ${{ steps.check.outputs.ready }}
        steps:
            - uses: actions/checkout@v5
              with:
                  persist-credentials: false

            - id: check
              env:
                  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
              run: |
                  missing=()
                  [[ -n "$EXPO_TOKEN" ]] || missing+=("the EXPO_TOKEN repository secret is not configured")
                  jq -e '.expo.extra.eas.projectId' apps/mobile/app.json >/dev/null \
                      || missing+=("apps/mobile/app.json has no expo.extra.eas.projectId (run eas init)")
                  jq -e '.scripts["eas-build-pre-install"]' apps/mobile/package.json >/dev/null \
                      || missing+=("apps/mobile/package.json has no eas-build-pre-install hook that builds the gitignored Rust core on the EAS worker")
                  if ((${#missing[@]} == 0)); then
                      echo "ready=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  echo "ready=false" >> "$GITHUB_OUTPUT"
                  {
                      echo "### EAS builds skipped"
                      echo
                      echo "The signed Android build and the EAS Simulator probe did not run:"
                      for reason in "${missing[@]}"; do
                          echo "- $reason"
                      done
                      echo
                      echo "The unsigned Android APK and the unsigned iOS .ipa from this run are still attached as artifacts."
                  } | tee -a "$GITHUB_STEP_SUMMARY"
                  for reason in "${missing[@]}"; do
                      echo "::warning title=EAS builds skipped::$reason"
                  done

    # Android only: a signed iOS build needs an Apple Developer team, and iOS
    # installs go through the unsigned device build instead.
    eas-android:
        name: EAS Android preview build (signed)
        needs: [gate, android-e2e, eas-preflight]
        if: needs.eas-preflight.outputs.ready == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 90
        env:
            EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        steps:
            - uses: actions/checkout@v5
              with:
                  persist-credentials: false

            - name: Install bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Install Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "24"

            - name: Install workspace deps
              run: bun install --frozen-lockfile

            - name: Build the signed Android preview
              working-directory: apps/mobile
              run: npx -y "eas-cli@$EAS_CLI_VERSION" build --profile preview --platform android --non-interactive --wait --json | tee "$RUNNER_TEMP/eas-builds.json"

            - name: Link the build
              run: |
                  {
                      echo "### EAS Android preview build"
                      jq -r '.[] | "- \(.platform): \(.artifacts.buildUrl // .artifacts.applicationArchiveUrl)"' "$RUNNER_TEMP/eas-builds.json"
                  } >> "$GITHUB_STEP_SUMMARY"

    # EAS Simulator is limited-access and the probe needs a linked EAS project,
    # so availability could not be established when this workflow was written.
    # This job records the answer on every tagged run; an iOS smoke job follows
    # once it reports access.
    ios-simulator-probe:
        name: EAS Simulator availability
        needs: [eas-preflight]
        if: needs.eas-preflight.outputs.ready == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        steps:
            - uses: actions/checkout@v5
              with:
                  persist-credentials: false

            - name: Install bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Install Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "24"

            - name: Install workspace deps
              run: bun install --frozen-lockfile

            - name: Probe EAS Simulator availability
              working-directory: apps/mobile
              run: |
                  if ! npx -y "eas-cli@$EAS_CLI_VERSION" simulator:availability --json | tee "$RUNNER_TEMP/simulator.json"; then
                      echo "::warning title=EAS Simulator unavailable::eas simulator:availability failed, so no iOS smoke run exists; iOS stays unverified."
                      exit 0
                  fi
                  {
                      echo "### EAS Simulator availability"
                      echo '```json'
                      cat "$RUNNER_TEMP/simulator.json"
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
