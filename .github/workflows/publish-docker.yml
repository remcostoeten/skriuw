name: Publish Docker image

# Builds the self-host web image and pushes it to the GitHub Container Registry
# so people can `docker pull ghcr.io/remcostoeten/skriuw` instead of cloning and
# building the whole repo. See README "Self-host with Docker".
#
# Triggers:
#   - push a tag like `v0.17.0`  -> publishes :0.17.0, :0.17, :latest
#   - manual `workflow_dispatch` -> publishes :latest (for testing the pipeline)

on:
    push:
        tags:
            - "v*.*.*"
    workflow_dispatch:
        inputs:
            version:
                description: "Optional semver tags to publish from the selected branch (for example 0.22.1)"
                required: false
                type: string

permissions:
    contents: read
    packages: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: docker/setup-qemu-action@v3

            - uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Derive image tags
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
                      type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  # linux/arm64 lets Apple-silicon and ARM servers pull natively.
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
