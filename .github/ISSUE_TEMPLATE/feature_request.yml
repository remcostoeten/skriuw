name: Feature request
description: Suggest a focused improvement to Skriuw.
title: "[Feature]: "
labels:
    - enhancement
body:
    - type: dropdown
      id: product
      attributes:
          label: Product line
          options:
              - v2 desktop
              - v1 web
              - v1 mobile
              - v1 self-hosted
              - Documentation or repository tooling
      validations:
          required: true
    - type: textarea
      id: problem
      attributes:
          label: Problem
          description: What are you trying to accomplish, and what currently gets in the way?
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: Proposed improvement
          description: Describe the outcome you would like. Implementation ideas are optional.
      validations:
          required: true
    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered
          description: How do you handle this today?
    - type: checkboxes
      id: scope
      attributes:
          label: Scope confirmation
          options:
              - label: I checked for an existing issue that covers this request.
                required: true
