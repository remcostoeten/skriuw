changelog:
  categories:
    - title: 'Features'
      labels:
        - 'feature'
        - 'enhancement'
    - title: 'Bug Fixes'
      labels:
        - 'fix'
        - 'bug'
    - title: 'Maintenance'
      labels:
        - 'chore'
        - 'refactor'
        - 'ci'
        - 'deps'
    - title: 'Other Changes'
      labels:
        - '*'
  exclude:
    labels:
      - 'skip-changelog'
