<!doctype html>
<html lang="en" suppressHydrationWarning>
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<title>Skriuw</title>
		<script>
			// Next.js inlines `process.env.*` at build; the SPA bundle has no
			// `process`. Desktop runs local-first, so every NEXT_PUBLIC_* feature
			// flag (collab, analytics) is intentionally unset → those features stay
			// off. Must run before the module bundle so module-eval reads don't throw.
			window.process = window.process || { env: { NODE_ENV: "production" } };
		</script>
		<script>
			// Theme bootstrap. Runs before the JS bundle so the saved theme's
			// background paints immediately instead of flashing the default — the
			// bundle's globals.css owns the real tokens but isn't loaded yet, hence
			// the local color map.
			(function () {
				var THEME_BG = {
					midnight: "#121212",
					graphite: "#1d1e21",
					paper: "#f5f2ec",
					monokai: "#24251f",
				};
				// Logo tint per theme: light themes get a dark mark, dark themes a
				// light one. Drives the splash logo before globals.css loads.
				var THEME_FG = {
					midnight: "#ededed",
					graphite: "#ededed",
					paper: "#1d1e21",
					monokai: "#ededed",
				};
				var theme = "midnight";
				try {
					var raw = localStorage.getItem("preferences-store");
					if (raw) {
						var parsed = JSON.parse(raw);
						var saved =
							parsed && parsed.state && parsed.state.appearance && parsed.state.appearance.theme;
						if (saved) theme = saved;
					}
				} catch (e) {}
				document.documentElement.setAttribute("data-theme", theme);
				document.documentElement.style.backgroundColor = THEME_BG[theme] || THEME_BG.midnight;
				document.documentElement.style.setProperty("--splash-fg", THEME_FG[theme] || THEME_FG.midnight);
			})();
		</script>
		<style>
			/* Splash: paints the logo on the themed background immediately, before
			   the JS bundle loads. main.tsx fades it out once React has mounted. */
			#splash {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: flex;
				align-items: center;
				justify-content: center;
				transition: opacity 240ms ease;
			}
			#splash.is-hidden {
				opacity: 0;
				pointer-events: none;
			}
			#splash svg {
				width: auto;
				height: 92px;
				color: var(--splash-fg, #ededed);
				animation: splash-pulse 1.4s ease-in-out infinite;
			}
			@keyframes splash-pulse {
				0%,
				100% {
					opacity: 0.4;
				}
				50% {
					opacity: 1;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#splash svg {
					animation: none;
				}
			}
		</style>
	</head>
	<body class="font-sans">
		<div id="splash" aria-hidden="true">
			<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 513" preserveAspectRatio="xMidYMid meet">
				<defs>
					<linearGradient id="splashLogoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
						<stop offset="0%" stop-color="currentColor" stop-opacity="1" />
						<stop offset="50%" stop-color="currentColor" stop-opacity="0.8" />
						<stop offset="100%" stop-color="currentColor" stop-opacity="1" />
					</linearGradient>
					<filter id="splashGlow">
						<feGaussianBlur stdDeviation="2" result="coloredBlur" />
						<feMerge>
							<feMergeNode in="coloredBlur" />
							<feMergeNode in="SourceGraphic" />
						</feMerge>
					</filter>
				</defs>
				<g fill="url(#splashLogoGradient)" filter="url(#splashGlow)">
					<path d="M6 52 L0 58 L0 391 L8 400 L82 440 L89 441 L94 439 L99 432 L99 104 L94 96 L14 52 Z" />
					<path d="M133 0 L123 8 L123 504 L130 511 L140 512 L237 463 L246 452 L246 64 L234 52 L150 6 Z" />
					<path d="M277 78 L272 83 L272 434 L278 440 L288 440 L378 391 L390 380 L390 139 L379 128 L299 78 Z" />
				</g>
			</svg>
		</div>
		<div id="root"></div>
		<div id="auth-drawer-portal"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
