[workspace]
members = [
    "crates/skriuw-ai",
    "crates/skriuw-ai-ollama",
    "crates/skriuw-ai-remote",
    "crates/skriuw-domain",
    "crates/skriuw-storage",
    "crates/skriuw-sqlite-wasm",
    "crates/skriuw-sqlite",
    "crates/skriuw-sync",
    "crates/skriuw-images",
    "crates/skriuw-fixtures",
    "crates/skriuw-runtime",
    "crates/skriuw-history",
    "crates/skriuw-history-git",
    "crates/skriuw-lifecycle",
    "crates/skriuw-cli",
    "crates/xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
# The extracted AI SDK, consumed as tagged git releases per its ADR 0005:
# `ai-providers` is taken on crates.io, and every Rust consumer is a checkout
# the owner builds himself, so a tag pinned through Cargo.lock is reproducible
# without publishing. Bumping the tag is a deliberate upgrade, never automatic.
ai-core = { git = "https://github.com/remcostoeten/remcostoeten-aIo", tag = "ai-v0.3.0" }
ai-providers = { git = "https://github.com/remcostoeten/remcostoeten-aIo", tag = "ai-v0.3.0" }
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
schemars = { version = "1", features = ["derive", "uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[profile.release]
codegen-units = 16
lto = "thin"
panic = "abort"
strip = true
